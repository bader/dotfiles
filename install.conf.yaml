- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/.alias: alias
    ~/.bash_profile: bash_profile
    ~/.bashrc: bashrc
    ~/.config/mc: config/mc
    ~/.env: env
    ~/.gitconfig: gitconfig
    ~/.gitignore: gitignore
    ~/.gvimrc: vim/gvimrc
    ~/.inputrc: inputrc
    ~/.config/nvim: neovim
    ~/.tmux.conf: tmux.conf
    ~/.vim: vim
    ~/.vimrc: vim/vimrc
    ~/.zshrc: zshrc
    ~/.claude/settings.json: claude/settings.json
    ~/.config/opencode/opencode.json: config/opencode/opencode.json
    ~/.config/opencode/tui.json: config/opencode/tui.json
    ~/.config/gh/config.yml: config/gh/config.yml

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - [bash scripts/install-neovim.sh, Installing Neovim]
