set -g default-terminal "screen-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",xterm-256color:RGB"

set -g default-shell /bin/bash

bind C-l send-keys 'C-l'

set-window-option -g automatic-rename on
set -g set-titles on                                    # Разрешить смену заголовков в оконном менеджере
set -g set-titles-string "tmux.#I.#W"                   # Формат строки заголовка

set -g base-index 1                                     # Начинать отсчёт окон с первого
set -g pane-base-index 1                                # Начинать отсчёт панелей с первого
set -g renumber-windows on                              # Перенумеровать все окна когда одно из окон закрылось

set -g history-limit 1000000                            # Размер буфера в линиях

set -g bell-action any                                  # Следить за активностью на всех окнах

setw -g monitor-activity on                             # Информировать когда есть активность в окнах
set -g visual-activity on                               # Показывать статусное сообщение при активности в каком либо окне

setw -g mouse on                                        # Прокрутка экрана с помощью мыши
set -g set-clipboard on                                 # Использовать системный буфер обмена
set -g allow-passthrough on                             # Разрешить передавать нажатия клавиш в терминал, даже если они совпадают с комбинациями tmux

# Cтатусбар -------------------------------------------------------------------

set -g display-time 2000                                # Время в миллисекундах, сколько будут отображаться сообщения (в статусбаре к примеру)
set -g status-position top                              # Строка статуса сверху, чтобы отделить от строки статуса VIM

# Цвета  ---------------------------------------------------------------------

# Цвета статусбара
set -g status-fg white
set -g status-bg default
set -g status-style default

# Цвета заголовков окон
set-window-option -g window-status-style fg=cyan,bg=default,dim

# Цвета активных окон
set-window-option -g window-status-current-style fg=white,bg=default,bright

# Цвета командной строки
set -g message-style fg=white,bg=black,bright

# Навигация в командной строке, и в списке окон как в vi
set -g status-keys vi
setw -g mode-keys vi

# Клавиатурные сочетания -----------------------------------------------------------------

unbind C-b                                              # "Разбиндинг" префикса по умолчанию
set -g prefix C-a                                       # Новый префикс для всех комбинаций клавиш - Ctrl-a
bind C-a send-prefix

# Unsorted

# THEME
set -g window-status-current-style fg=black,bg=white,bold
#set -g status-interval 60
set -g status-left-length 30
set -g status-left '#[fg=green](#S) #(whoami)'
#set -g status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg)#[default] #[fg=white]%H:%M#[default]'

